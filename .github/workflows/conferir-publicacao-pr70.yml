name: Conferência pública da PR 70

on:
  push:
    branches: [verificacao/publicacao-pr70]
    paths: [.github/workflows/conferir-publicacao-pr70.yml]

permissions:
  contents: read

jobs:
  conferir:
    name: Nove fluxos públicos .NET e Git
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recuperar somente o código já integrado e verificado
        uses: actions/checkout@v4
        with:
          ref: 714991c0f7e066ab5a92a3ee40e48f0568375e3f
          persist-credentials: false
      - name: Conferir o SHA dos testes
        run: test "$(git rev-parse HEAD)" = "714991c0f7e066ab5a92a3ee40e48f0568375e3f"
      - name: Preparar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar as dependências verificadas
        run: npm ci
      - name: Usar os espelhos oficiais para o navegador
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Preparar a conferência do domínio público
        run: |
          cat > playwright.publico-pr70.config.mjs <<'CONFIGURACAO'
          import {defineConfig} from '@playwright/test';
          export default defineConfig({
            testDir:'./tests/e2e',
            testMatch:['dotnet-fundamentos.spec.ts','git-bancada.spec.ts'],
            timeout:60000,
            fullyParallel:false,
            workers:1,
            retries:0,
            reporter:[['list'],['html',{open:'never'}]],
            outputDir:'test-results-publico',
            use:{
              baseURL:'https://code-lab-omega.vercel.app',
              channel:'chromium',
              headless:true,
              viewport:{width:1440,height:1000},
              trace:'retain-on-failure',
              screenshot:'only-on-failure'
            }
          });
          CONFIGURACAO
      - name: Executar todos os nove fluxos públicos sem executor remoto
        run: npx playwright test --config playwright.publico-pr70.config.mjs
      - name: Preservar os resultados da conferência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conferencia-publica-pr70
          path: |
            test-results-publico/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
