name: Validação do CODELAB

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  auditar:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Preparar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Rejeitar vulnerabilidades altas ou críticas
        run: npm audit --json --audit-level=high

  validar:
    name: Testes e compilação
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: codelab
          POSTGRES_PASSWORD: codelab
          POSTGRES_DB: codelab
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Preparar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Instalar dependências
        run: npm ci

      - name: Validar as aulas e a lógica
        run: npm test

      - name: Validar exemplos de Python, C++, C#, PostgreSQL e TypeScript
        run: node scripts/verify-content-examples.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: codelab
          PGPASSWORD: codelab
          PGDATABASE: codelab

      - name: Validar isolamento PostgreSQL em conexões distintas
        run: node scripts/verify-sql-concurrency.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: codelab
          PGPASSWORD: codelab
          PGDATABASE: codelab

      - name: Compilar a aplicação
        run: npm run build

      - name: Compilar a API
        run: dotnet build server/CodeLab.Api.csproj --configuration Release

      - name: Validar cache e falhas da observação meteorológica sem rede
        run: dotnet run --project tests/meteorologia-api/Verificacao.csproj --configuration Release

      - name: Instalar Chromium para os testes de navegador
        run: npx playwright install --with-deps chromium

      - name: Validar os fluxos no navegador
        run: npm run test:e2e

      - name: Guardar relatório e cenários atmosféricos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-verificacao
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
