name: Validação por impacto

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**/*.md', 'README.md', 'STATUS.md', 'docs/**/*.txt']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**/*.md', 'README.md', 'STATUS.md', 'docs/**/*.txt']

permissions:
  contents: read

concurrency:
  group: impacto-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  planejar:
    name: Selecionar verificações afetadas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      produto: ${{ steps.plano.outputs.produto }}
      conteudo: ${{ steps.plano.outputs.conteudo }}
      tipos: ${{ steps.plano.outputs.tipos }}
      unidades: ${{ steps.plano.outputs.unidades }}
      exemplos: ${{ steps.plano.outputs.exemplos }}
      navegador: ${{ steps.plano.outputs.navegador }}
      dotnet: ${{ steps.plano.outputs.dotnet }}
      api: ${{ steps.plano.outputs.api }}
      postgres: ${{ steps.plano.outputs.postgres }}
      meteorologia: ${{ steps.plano.outputs.meteorologia }}
      concorrencia_sql: ${{ steps.plano.outputs.concorrencia_sql }}
      canais: ${{ steps.plano.outputs.canais }}
      auditoria: ${{ steps.plano.outputs.auditoria }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Identificar arquivos, contratos e runtimes
        id: plano
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" = push ]; then
            node scripts/impacto-validacao.mjs "$BASE_SHA" --pos-merge
          else
            node scripts/impacto-validacao.mjs "$BASE_SHA"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: plano-validacao
          path: plano-validacao.json
          retention-days: 7

  validar:
    name: Contratos afetados e build necessário
    needs: planejar
    if: needs.planejar.outputs.produto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: plano-validacao
      - uses: actions/setup-dotnet@v4
        if: needs.planejar.outputs.dotnet == 'true'
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - name: Conferir catálogo e métricas geradas
        if: needs.planejar.outputs.conteudo == 'true'
        run: |
          node scripts/generate-curriculum-index.mjs --check
          node scripts/gerar-metricas.mjs --check
      - name: Conferir tipos
        if: needs.planejar.outputs.tipos == 'true'
        run: npx tsc --noEmit
      - name: Testar apenas contratos afetados
        if: needs.planejar.outputs.unidades == 'true'
        run: node scripts/validar-alteracoes.mjs unidades
      - name: Conferir cache, expiração e fallback da meteorologia afetada
        if: needs.planejar.outputs.meteorologia == 'true'
        run: dotnet run --project tests/meteorologia-api/Verificacao.csproj --configuration Release
      - name: Preparar PostgreSQL somente quando necessário
        if: needs.planejar.outputs.postgres == 'true'
        run: node scripts/preparar-postgres-ci.mjs
      - name: Executar referências das famílias afetadas
        if: needs.planejar.outputs.exemplos == 'true'
        run: node scripts/validar-alteracoes.mjs exemplos
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: codelab
          PGPASSWORD: codelab
          PGDATABASE: codelab
      - name: Conferir concorrência SQL em conexões distintas
        if: needs.planejar.outputs.concorrencia_sql == 'true'
        run: node scripts/verify-sql-concurrency.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: codelab
          PGPASSWORD: codelab
          PGDATABASE: codelab
      - name: Auditar alterações de dependências
        if: needs.planejar.outputs.auditoria == 'true'
        run: npm audit --json --audit-level=high
      - name: Compilar uma vez para os fluxos selecionados
        if: needs.planejar.outputs.navegador == 'true'
        run: npm run build
      - name: Compilar API somente para seus testes
        if: needs.planejar.outputs.api == 'true'
        run: dotnet build server/CodeLab.Api.csproj --configuration Release
      - uses: actions/upload-artifact@v4
        if: needs.planejar.outputs.navegador == 'true'
        with:
          name: aplicacao-compilada
          path: |
            dist/
            server/Content/curriculum.json
            server/bin/Release/
            server/obj/
            plano-validacao.json
          retention-days: 1
      - name: Encerrar o banco descartável
        if: always() && needs.planejar.outputs.postgres == 'true'
        run: |
          if docker container inspect codelab-postgres-ci > /dev/null 2>&1; then
            docker rm --force --volumes codelab-postgres-ci
          fi

  navegador:
    name: Fluxos afetados (${{ matrix.canal }})
    needs: [planejar, validar]
    if: needs.planejar.outputs.navegador == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        canal: ${{ fromJSON(needs.planejar.outputs.canais) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        if: needs.planejar.outputs.api == 'true'
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: aplicacao-compilada
      - name: Usar espelhos oficiais do navegador
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
      - run: npx playwright install --with-deps ${{ matrix.canal }}
      - name: Conferir áreas afetadas ou smoke após merge
        run: npx playwright test --config playwright.impacto.config.ts
        env:
          CODELAB_CANAL: ${{ matrix.canal }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-afetados-${{ matrix.canal }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
